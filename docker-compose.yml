version: '3.8'

services:
  dhan-algo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dhan-algo-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backend/strategies/custom:/app/backend/strategies/custom
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
